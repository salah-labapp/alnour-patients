<div class="grid"><a class="big" href="#/prices"><span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#e0218a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3"/><path d="M8 15h8"/></svg></span>أسعار التحاليل</a><a class="big" href="#/book"><span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#e0218a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span>احجز موعد</a><a class="big" href="#/rx"><span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#e0218a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="4"/></svg></span>ابعت الروشتة</a><a class="big" href="${waLink('السلام عليكم، عايز أستفسر من معامل النور')}" target="_blank" rel="noopener"><span><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#e0218a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.7 7L4 20l1.2-4.6A8 8 0 1 1 21 12z"/></svg></span>واتساب</a></div>
<a class="btn alt" href="tel:${L.phone}">اتصل ${L.phone}</a>`,
'/prices':()=>{
 return `<input id="q" type="search" placeholder="ابحث عن تحليل..." value="${esc(state.q)}" autocomplete="off">
<div class="card" id="list"></div><div id="selbar"></div>`},
'/book':()=>`<div class="card"><label>الاسم</label><input id="bn" placeholder="اسمك"><label>التاريخ</label><input id="bd" type="date"><label>الوقت المناسب</label><select id="bt"><option>صباحًا</option><option>ظهرًا</option><option>مساءً</option></select>
<label>ملاحظات (اختياري)</label><textarea id="bnote" rows="2" placeholder="مثال: تحليل صائم، زيارة منزلية..."></textarea>
<div class="note" id="btests"></div><div class="err" id="berr"></div><a class="btn wa" id="bsend" href="#">أرسل طلب الحجز على واتساب</a></div>`,
'/rx':()=>`<div class="card"><b>ابعت الروشتة للمعمل</b>
<div class="warnbox" id="inapp" hidden>أنت فاتح التطبيق من داخل تطبيق تاني (واتساب أو فيسبوك). افتح الرابط من متصفح الموبايل (Chrome أو Safari) عشان الإرسال يشتغل.</div>
<ol class="steps"><li>اضغط "صوّر الروشتة" أو "اختار من المعرض".</li><li>اضغط "إرسال على واتساب" واختار واتساب من القايمة.</li><li>لو القايمة مظهرتش، اضغط "افتح واتساب المعمل" وضيف الصورة بنفسك (علامة المشبك ثم المعرض).</li></ol>
<label class="btn pick" for="rxcam">صوّر الروشتة</label><input id="rxcam" type="file" accept="image/*" capture="environment" hidden>
<label class="btn pick alt2" for="rxgal">اختار من المعرض</label><input id="rxgal" type="file" accept="image/*" hidden>
<img id="rxp" class="preview" alt="" hidden>
<div class="err" id="rxerr"></div><div class="ok" id="rxok"></div>
<button class="btn wa" id="rxs" type="button">إرسال على واتساب</button>
<a class="btn alt" id="rxopen" href="${waLink('السلام عليكم، هبعتلكم صورة الروشتة من تطبيق '+L.name)}" target="_blank" rel="noopener">افتح واتساب المعمل</a>
<a class="btn alt" id="rxsave" href="#" download="roshta.jpg" hidden>حفظ الصورة على الموبايل</a>
<p class="note">لو الصورة مظهرتش في الإرسال: اضغط مطولاً على الصورة فوق واختار حفظ أو نسخ.</p></div>`,
'/contact':()=>`<div class="card"><b>${L.name}</b><p>${L.phone}</p></div><a class="btn" href="tel:${L.phone}">اتصال هاتفي</a><a class="btn wa" href="${waLink('السلام عليكم، عايز أستفسر من معامل النور')}" target="_blank" rel="noopener">راسلنا على واتساب</a>`
};
function renderList(){const q=state.q.trim().toLowerCase();
 const rows=T.filter(t=>(state.cat==='الكل'||t.cat===state.cat)&&(!q||t.name.toLowerCase().includes(q)));
 $('#list').innerHTML=rows.length?rows.map(t=>`<div class="row"><div><div dir="auto">${esc(t.name)}</div><div class="cat" dir="auto">${t.cat?'العينة: '+esc(t.cat):''}</div></div><div><span class="price">${priceText(t.price)}</span> <button type="button" class="add ${state.sel.has(t.id)?'on':''}" data-id="${t.id}">${state.sel.has(t.id)?'✓':'+'}</button></div></div>`).join(''):'<p class="note">مفيش تحليل بالاسم ده. اسأل المعمل على واتساب.</p>';
 const n=state.sel.size;$('#selbar').innerHTML=n?`<div class="sel"><span>${n} تحليل · ${total()} جنيه</span><a href="#/book">احجز</a></div>`:'';}
function bind(r){
 if(r==='/prices'){$('#q').oninput=e=>{state.q=e.target.value;renderList()};
  $('#list').onclick=e=>{const b=e.target.closest('.add');if(!b)return;const id=+b.dataset.id;state.sel.has(id)?state.sel.delete(id):state.sel.add(id);safeSet('sel',JSON.stringify([...state.sel]));renderList()};renderList()}
 if(r==='/book'){$('#bd').min=new Date().toISOString().slice(0,10);
  $('#btests').innerHTML=chosen().length?'التحاليل المختارة: '+chosen().map(t=>esc(t.name)).join('، ')+' (الإجمالي '+total()+' جنيه)':'لم تختر تحاليل. تقدر تختار من صفحة الأسعار أو تكتبها في الملاحظات.';
  $('#bsend').onclick=e=>{const n=$('#bn').value.trim(),d=$('#bd').value;if(!n||!d){e.preventDefault();$('#berr').textContent='من فضلك اكتب الاسم واختر التاريخ.';return}
   $('#berr').textContent='';const note=$('#bnote').value.trim();
   const msg=`السلام عليكم، عايز أحجز موعد في ${L.name}.\nالاسم: ${n}\nالتاريخ: ${d}\nالوقت: ${$('#bt').value}`+testsMsg()+(note?'\nملاحظات: '+note:'');
   e.target.href=waLink(msg);e.target.target='_blank';e.target.rel='noopener'}}
 if(r==='/rx'){
  if(/FBAN|FBAV|Instagram|Line\/|; wv\)|WhatsApp/i.test(navigator.userAgent))$('#inapp').hidden=false;
  const onFile=inp=>{const f=inp.files[0];if(!f)return;$('#rxerr').textContent='';$('#rxok').textContent='جاري تجهيز الصورة...';
   prep(f).then(j=>{state.rxFile=j;state.rxUrl=URL.createObjectURL(j);const p=$('#rxp');p.src=state.rxUrl;p.hidden=false;const sv=$('#rxsave');sv.href=state.rxUrl;sv.hidden=false;$('#rxok').textContent='الصورة جاهزة. اضغط إرسال على واتساب.'}).catch(()=>{$('#rxok').textContent='';$('#rxerr').textContent='معرفناش نقرأ الصورة. جرب تصوّر تاني.'})};
  $('#rxcam').onchange=e=>onFile(e.target);$('#rxgal').onchange=e=>onFile(e.target);
  $('#rxs').onclick=()=>{const f=state.rxFile;if(!f){$('#rxerr').textContent='صوّر الروشتة الأول أو اختارها من المعرض.';return}
   const text='السلام عليكم، دي صورة الروشتة من تطبيق '+L.name;let canShare=false;
   try{canShare=!!(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))}catch(e){}
   if(canShare){navigator.share({files:[f],text}).then(()=>{$('#rxerr').textContent='';$('#rxok').textContent='تم فتح المشاركة. تأكد إنك بعت الصورة في محادثة المعمل.'}).catch(e=>{if(e&&e.name==='AbortError')return;fallback('المشاركة المباشرة مش شغالة على جهازك.')});return}
   fallback('جهازك مش بيدعم المشاركة المباشرة للصور.')};
  function fallback(why){$('#rxok').textContent='';$('#rxerr').innerHTML=why+' اتبع الخطوات: 1) اضغط "حفظ الصورة على الموبايل". 2) اضغط "افتح واتساب المعمل". 3) في المحادثة اضغط المشبك واختار الصورة وابعتها.';
   try{if(navigator.clipboard&&window.ClipboardItem)navigator.clipboard.write([new ClipboardItem({'image/png':pngBlob(state.rxFile)})]).catch(()=>{})}catch(e){}
   $('#rxsave').scrollIntoView({behavior:'smooth',block:'center'})}
 }
}
function render(){const r=(location.hash.replace('#','')||'/');const f=routes[r]||routes['/'];const k=routes[r]?r:'/';
 view.innerHTML=f();document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.r===k));bind(k);window.scrollTo(0,0)}
window.addEventListener('hashchange',render);render();

})();
</script>
</body></html>
