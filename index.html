<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e0218a">

<title>معامل النور الطبية</title>
<link rel="stylesheet" href="bg.css"><link rel="stylesheet" href="slider.css"><link rel="stylesheet" href="slider2.css"><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:#fff7fb;color:#2a1237;padding-bottom:70px}
.top{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,#7b2cbf,#e0218a);border-bottom:4px solid #f5b301;color:#fff;padding:14px 16px}.top h1{margin:0;font-size:20px}.top small{opacity:.85}
.logo{width:42px;height:42px;border-radius:12px;background:#fff;color:#7b2cbf;display:grid;place-items:center;font-size:26px;font-weight:700}
.banner{background:#fff4d6;color:#6b4e00;padding:8px 16px;font-size:13px}
main{max-width:640px;margin:0 auto;padding:16px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #f1d3e8}
.tabs a{flex:1;text-align:center;padding:14px 4px;color:#6a4a66;text-decoration:none;font-size:14px}.tabs a.on{color:#7b2cbf;font-weight:700;border-top:3px solid #7b2cbf;margin-top:-1px}
.card{background:#fff;border:1px solid #f1d3e8;border-radius:14px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid #f1d3e8;border-radius:14px;padding:18px 10px;text-align:center;font-weight:700}
.big span{display:block;margin-bottom:6px}.big svg{display:block;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;background:linear-gradient(120deg,#7b2cbf,#e0218a);color:#fff;text-align:center;text-decoration:none;cursor:pointer;margin-top:10px}
.btn.wa{background:linear-gradient(120deg,#f5b301,#ff8f00);color:#2a1237}.btn.yt{background:linear-gradient(120deg,#ff1f4b,#c4302b);color:#fff}.btn.alt{background:#fff;color:#7b2cbf;border:2px solid #7b2cbf}
input,select,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #e3b8d6;border-radius:10px;margin:4px 0 10px;font-family:inherit;background:#fff}
label{font-size:14px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #f6e4f0}.row:last-child{border:0}
.price{font-weight:700;color:#c2187a;white-space:nowrap}.cat{font-size:12px;color:#8a6a85}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.chip{flex:none;border:1px solid #e3b8d6;background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;cursor:pointer}.chip.on{background:#7b2cbf;color:#fff;border-color:#7b2cbf}
.add{border:1px solid #7b2cbf;color:#7b2cbf;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}.add.on{background:#7b2cbf;color:#fff}
.qwrap{position:relative}.qwrap input{padding-left:46px}.arn{font-size:14px;color:#7b2cbf;font-weight:600}
.qx{position:absolute;left:8px;top:12px;width:30px;height:30px;border-radius:50%;border:1px solid #e3b8d6;background:#fff;color:#e0218a;font-size:15px;cursor:pointer;padding:0;line-height:1}.sel .acts{display:flex;gap:12px;align-items:center}.sel button{border:2px solid #ffd54a;background:transparent;color:#ffd54a;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.sel{position:sticky;bottom:64px;background:#7b2cbf;color:#fff;border-radius:12px;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.sel a{color:#fff;font-weight:700}
.preview{width:100%;border-radius:12px;margin-top:8px}.note{font-size:13px;color:#6a4a66}.err{color:#b3261e;font-size:14px}

.logo{color:#e0218a}.tabs a.on{color:#e0218a;border-top-color:#f5b301}
.big svg{stroke:#e0218a}.big:nth-child(even) svg{stroke:#7b2cbf}.big{border-color:#f5b301;border-width:2px}
.sel{background:linear-gradient(120deg,#7b2cbf,#e0218a)}.sel a{color:#ffd54a}
.add{border-color:#e0218a;color:#e0218a}.add.on{background:#e0218a;color:#fff}
.btn.pick{margin-top:8px}.btn.alt2{background:linear-gradient(120deg,#e0218a,#ff6bb5)}
.steps{padding-right:20px;padding-left:0;font-size:14px;line-height:1.8;margin:8px 0}
.warnbox{background:#fff4d6;border:2px solid #f5b301;border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.ok{color:#2e7d32;font-size:14px;margin:6px 0}.err{line-height:1.7}
.btn.alt{color:#7b2cbf;border-color:#7b2cbf;background:#fff}

.numbox{background:#fff7e0;border:2px solid #f5b301;border-radius:12px;padding:10px;text-align:center;margin:10px 0}.numbox b{display:block;font-size:24px;color:#7b2cbf;letter-spacing:1px;margin:4px 0}.btn.copy{margin-top:6px;padding:10px}
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;background-size:cover;background-position:center}
.top img.lg{width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #f5b301}
.hero{display:flex;gap:12px;align-items:center}
.hero2{position:relative;height:300px;border-radius:18px;overflow:hidden;border:2px solid #f5b301;box-shadow:0 6px 18px rgba(123,44,191,.35);margin:0 0 12px}
.hero2 i{position:absolute;inset:0;background-size:cover;background-position:center 22%;opacity:0;animation:f4 24s ease-in-out infinite}
.hero2 i.b{animation-delay:-18s}
.hero2 i.c{animation-delay:-12s}
.hero2 i.d{animation-delay:-6s}
@keyframes f4{0%{opacity:0}4%,25%{opacity:1}29%,100%{opacity:0}}
.hero2 .sheen{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.38) 48%,rgba(255,255,255,.06) 54%,transparent 72%);transform:translateX(-130%);animation:sheen 6s ease-in-out infinite;pointer-events:none}
@keyframes sheen{0%{transform:translateX(-130%)}55%,100%{transform:translateX(130%)}}.hero img{width:72px;height:72px;border-radius:50%;border:3px solid #f5b301}
body{background:#fff7fb}
.sharebtn{background:linear-gradient(120deg,#f5b301,#ff8f00);color:#2a1237;font-size:18px;padding:16px;box-shadow:0 4px 12px rgba(245,179,1,.45)}.stars{display:flex;gap:6px;justify-content:center;margin:12px 0;direction:ltr}.star{background:none;border:0;padding:2px;cursor:pointer}.star svg{fill:#fff;stroke:#f5b301;stroke-width:1.6}.star.on svg{fill:#f5b301}</style>
